<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Plants | Plant Tracker</title>
  <link rel="stylesheet" href="/css/styles.css">
  <script type="module" src="/js/plant-gallery.js"></script>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/fetch/index.html">&#127807; Plant Tracker</a>
    <nav><a class="active" href="/fetch/index.html">Home</a><a href="/fetch/about.html">About</a><a href="/fetch/form.html">Add a Plant</a></nav>
  </header>
  <main class="container">
    <h1>My Plants</h1>
    <form id="search-form" class="search">
      <input id="search-name" type="text" name="name" placeholder="Search by name" aria-label="Search by name">
      <select id="search-light" name="light" aria-label="Filter by light needs">
        <option value="">Any light</option><option value="LOW">Low</option><option value="MEDIUM">Medium</option><option value="BRIGHT">Bright</option>
      </select>
      <button type="submit">Search</button><button id="clear-search" type="button">Clear</button>
    </form>
    <p id="status" role="status" aria-live="polite"></p>
    <p id="count" class="count"></p>
    <div id="plant-grid" class="grid"></div>
  </main>
  <footer class="site-footer">Plant Tracker demo &middot; Vanilla JavaScript + REST API</footer>
</body>
</html>
