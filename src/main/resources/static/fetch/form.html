<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Add a Plant | Plant Tracker</title>
  <link rel="stylesheet" href="/css/styles.css">
  <script type="module" src="/js/plant-form.js"></script>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/fetch/index.html">&#127807; Plant Tracker</a>
    <nav><a href="/fetch/index.html">Home</a><a href="/fetch/about.html">About</a><a class="active" href="/fetch/form.html">Add a Plant</a></nav>
  </header>
  <main class="container">
    <h1 id="form-title">Add a Plant</h1>
    <p id="status" role="status" aria-live="polite"></p>
    <form id="plant-form" class="form">
      <label for="name">Name</label><input id="name" name="name" type="text" required>
      <label for="lightNeeds">Light needs</label>
      <select id="lightNeeds" name="lightNeeds" required><option value="">Choose...</option><option value="LOW">Low</option><option value="MEDIUM">Medium</option><option value="BRIGHT">Bright</option></select>
      <label for="lastWatered">Last watered</label><input id="lastWatered" name="lastWatered" type="date" required>
      <label for="wateringIntervalDays">Watering interval (days)</label><input id="wateringIntervalDays" name="wateringIntervalDays" type="number" min="1" max="365" required>
      <label class="check"><input id="toxicToPets" name="toxicToPets" type="checkbox"> Toxic to pets</label>
      <div class="actions"><button id="save-button" type="submit">Save</button><a id="cancel-link" href="/fetch/index.html">Cancel</a></div>
    </form>
  </main>
  <footer class="site-footer">Plant Tracker demo &middot; Vanilla JavaScript + REST API</footer>
</body>
</html>
