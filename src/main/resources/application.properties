spring.application.name=plant-api
# Set these as environment variables locally and on deployment paltform:
#   SPRING_DATASOURCE_URL="YOUR _NEON_DATABASE_URL"
# Spring Boot reads those names automatically, so nothing secret lives in this file.

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Use the next two lines to debug what SQL queries are being executed by Hibernate,
# otherwise comment them out
#logging.level.org.hibernate.SQL=DEBUG
#logging.level.org.hibernate.orm.jdbc.bind=TRACE

server.port=${PORT:8080}

# --- Image uploads ---
# These limits are the hard cap that Spring enforces before our code runs.
spring.servlet.multipart.max-file-size=3MB
spring.servlet.multipart.max-request-size=6MB